<style>

.side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rate{border:1px solid var(--line);background:#fff;font:inherit;font-size:.82rem;color:#475069;cursor:pointer;border-radius:999px;padding:3px 11px;white-space:nowrap}

@media (max-width:640px){h1{font-size:1.3rem}
  .tabs{gap:5px;padding:10px 12px 2px}.tab{font-size:.82rem;padding:5px 7px 5px 9px;border-radius:10px}.tab .n{font-size:.68rem}
  .fld{flex:1 1 30%}.ctx{font-size:1.08rem;padding:10px 12px 0}.tabsep{flex-basis:100%;width:auto;height:0;margin:0;background:none}#totop{bottom:14px;left:14px}.fld select{width:100%}header{padding:14px 16px 12px}.sub{font-size:.85rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chip{flex:0 0 auto}
  .tabs.sub{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.tabs.sub .tab{font-size:.8rem}
  .search select{flex:1 1 40%}.tools{padding:8px 12px}.row{padding:9px 12px}.side{width:100%;justify-content:flex-start;padding-inline-start:0}

</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="https://www.kol-toda.co.il/t/books.html">→ לכל הקטלוגים באתר הקול החמישי</a>
  <h1 id="title">קטלוג חומרים</h1>
  <div class="sub" style="font-weight:700;opacity:1">ספריית חומרים למורים</div>
  <div class="sub" id="sub"></div>
</div></header>

<div class="tools"><div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="חיפוש בכל הפרשות – למשל: מרגלים, תפזורת, מבחן…" autocomplete="off">
    <div class="fld"><label for="grade">כיתה</label><select id="grade"><option value="">כל הכיתות</option></select></div>
    <div class="fld"><label for="src">מקור</label><select id="src"><option value="">כל המקורות</option></select></div>
    <div class="fld"><label for="sort">סדר</label><select id="sort"><option value="cv">לפי פרק ופסוק</option><option value="abc">לפי א״ב</option><option value="rate">המדורגים קודם</option></select></div>
  </div>
  <div class="chips"><span class="lbl">סוג חומר:</span><span id="fmt" class="chips" style="margin:0"></span></div>
  <div class="active" id="active"></div>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="tabs sub" id="subtabs"></div>
  <div class="ctx"><span id="ctx" class="ctxt"></span>
    <span class="view" role="group" aria-label="תצוגה"><button data-view="grid">▦ כרטיסים</button><button data-view="list">☰ רשימה</button></span></div>
  <main id="main"><div class="empty">טוען…</div></main>
</div>

<script>
// icon, button text, colour, background – the same colours as the Neviim catalogs
const FMT = {pdf:["📕","PDF","#e11d48","#fde8ec"],word:["📘","Word","#2563eb","#e8eefd"],ppt:["🖥️","מצגת","#ea580c","#fdece0"],
  video:["🎬","סרטון","#dc2626","#fde8e8"],game:["🎮","משחק מקוון","#7c3aed","#f1eafe"],web:["🔗","קישור","#4f46e5","#eceafd"],
  folder:["📁","תיקייה","#ca8a04","#fdf6e0"],excel:["📗","Excel","#16a34a","#e7f7ec"],image:["🖼️","תמונה","#0d9488","#e0f5f1"],
  audio:["🎵","שמע","#0891b2","#e0f5fa"]};
const CATCOL = {lesson:["#4f46e5","#e9e8fd"], pres:["#ea580c","#fdeadb"], work:["#2563eb","#e3ecfd"], test:["#e11d48","#fde4ea"],
  game:["#7c3aed","#efe6fe"], story:["#0d9488","#dcf3ef"], art:["#db2777","#fce4f1"], summary:["#16a34a","#e2f5e8"], more:["#64748b","#eceff4"]};
// 6: the button says what it does
FMT.gamma = ["🖥️", "Gamma", "#9333ea", "#f3e8ff"];
const VERB = {gamma:"פתחו מצגת", pdf:"PDF להדפסה", word:"Word לעריכה", ppt:"פתחו מצגת", video:"▶ צפו בסרטון", game:"🎮 שחקו", web:"פתחו קישור",
  folder:"פתחו תיקייה", excel:"פתחו Excel", image:"צפו בתמונה", audio:"▶ האזינו"};
const FILTERS = [["","הכל"],["pdf","להדפסה"],["word","לעריכה"],["ppt","מצגות"],["video","סרטונים"],["game","משחקים מקוונים"],["fav","♥ השמורים שלי"]];
let D, state = {tab:null, q:"", fmt:"", src:"", grade:"", sort:"cv"}, PAGE = 40;
const LS = k => "cat2_" + (D ? D.book : "") + "_" + k;
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(LS(k))) ?? d; } catch(e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch(e) {} };
let FAV = new Set(), MINE = {};
// optional second level: D.groups = [{k,l,e}], and each tab names its group in "g" (e.g. eras -> people).
// A group key is a valid state.tab too: it shows every item of the group's tabs.
let TG = {};
const isGroup = k => !!(D.groups && D.groups.some(g => g.k === k));
const tabLabel = k => ((D.tabs.find(t => t.k === k) || (D.groups || []).find(g => g.k === k)) || {}).l || "";
const inTab = it => it.tab === state.tab || TG[it.tab] === state.tab;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).replace(/[֑-ׇ]/g, "").toLowerCase();
const keyOf = it => it.files[0].id;
const idsOf = it => it.files.map(f => f.id).concat(it.dup || []);

function rating(it) {
  const R = window.__ratingsApi && window.__ratingsApi.ratingsCache;
  let sum = 0, count = 0;
  if (R) idsOf(it).forEach(id => { const r = R.get(id); if (r) { sum += r.sum || 0; count += r.count || 0; } });
  return {avg: count ? sum / count : 0, count};
}

function visibleItems() {
  const q = norm(state.q.trim());
  return D.items.filter(it => {
    if (state.fmt === "fav") { if (!FAV.has(keyOf(it))) return false; }
    else if (state.fmt && !it.files.some(f => f.f.replace("achiya:", "") === state.fmt || (state.fmt === "ppt" && f.f === "gamma"))) return false;
    if (state.src && it.s !== state.src) return false;
    if (state.grade && it.gr && it.gr !== state.grade) return false;   // unknown grade stays visible
    if (q) return norm(it.t).includes(q);
    if (state.fmt === "fav") return true;
    return inTab(it);
  });
}

function renderTabs() {
  const cnt = {}; D.items.forEach(i => { cnt[i.tab] = (cnt[i.tab] || 0) + 1; if (TG[i.tab]) cnt[TG[i.tab]] = (cnt[TG[i.tab]] || 0) + 1; });
  if (D.groups) return renderGroupTabs(cnt);
  const box = document.getElementById("tabs");
  if (D.tabs.some(t => t.img)) {   // picture tabs: "name · grade" -> a card with the name, the grade under it and the count
    box.classList.add("big");
    box.innerHTML = D.tabs.map(t => { const [name, sub] = t.l.split(" · ");
      return `<button class="tab tile${t.k === state.tab && !state.q && state.fmt !== "fav" ? " on" : ""}" data-k="${esc(t.k)}" title="${esc(t.l)}">` +
        (t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy">` : "") +
        `<span class="tl"><b>${t.e} ${esc(name.split(":")[0])}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="n">${cnt[t.k] || 0}</span></button>`; }).join("");
    return;
  }
  const aux = ["general", "skills"], one = (t, cls) =>
    `<button class="tab${cls}${t.k === state.tab && !state.q && state.fmt !== "fav" ? " on" : ""}" data-k="${esc(t.k)}" title="${esc(t.l)}">${t.e} ${esc(t.l.split(":")[0])}<span class="n">${cnt[t.k] || 0}</span></button>`;
  document.getElementById("tabs").innerHTML = D.tabs.filter(t => aux.includes(t.k)).map(t => one(t, " aux")).join("") +
    '<span class="tabsep"></span>' + D.tabs.filter(t => !aux.includes(t.k)).map(t => one(t, "")).join("");
}

function renderGroupTabs(cnt) {
  const live = !state.q && state.fmt !== "fav", cur = live ? (isGroup(state.tab) ? state.tab : TG[state.tab]) : null;
  const one = (t, cls) => `<button class="tab${cls}${live && t.k === state.tab ? " on" : ""}" data-k="${esc(t.k)}" title="${esc(t.l)}${t.y ? " · " + esc(t.y) : ""}">${t.e} ${esc(t.l.split(":")[0])}<span class="n">${cnt[t.k] || 0}</span></button>`;
  document.getElementById("tabs").innerHTML = D.tabs.filter(t => !t.g).map(t => one(t, " aux")).join("") + '<span class="tabsep"></span>' +
    D.groups.filter(g => cnt[g.k]).map(g => one(g, " grp" + (cur === g.k && g.k !== state.tab ? " in" : ""))).join("");
  const sub = document.getElementById("subtabs");
  sub.innerHTML = cur ? D.tabs.filter(t => t.g === cur && cnt[t.k]).map(t => one(t, "")).join("") : "";
  const on = sub.querySelector(".tab.on");
  if (on && sub.scrollWidth > sub.clientWidth) on.scrollIntoView({block: "nearest", inline: "center"});
}

function rowHtml(it, showTab) {
  const r = rating(it), k = keyOf(it), mine = MINE[k] || 0;
  const tabL = showTab ? tabLabel(it.tab).split(":")[0] : "";
  const icon = (FMT[it.files[0].f.replace("achiya:", "")] || FMT.web)[0];
  const btns = it.files.map(btnHtml).join("");
  const stars = [1,2,3,4,5].map(v => `<button class="${v <= mine ? "on" : ""}" data-rate="${v}" aria-label="דירוג ${v}">★</button>`).join("");
  return `<div class="row" data-id="${esc(k)}">
    ${thumbHtml(it, icon)}
    <div class="ti"><div class="name" title="${esc(it.t)}">${esc(it.t)}</div>
      <div class="meta">${it.gr ? `<span class="badge grade">${esc(it.gr)}</span>` : ""}${tabL ? `<span class="badge tabname">${esc(tabL)}</span>` : ""}${it.s ? `<span class="badge"${it.also ? ` title="נמצא גם ב: ${esc(it.also.join(", "))}"` : ""}>${esc(it.s)}</span>` : ""}${it.n ? `<span class="badge new">חדש</span>` : ""}</div></div>
    <div class="btns">${btns}</div>
    <div class="side"><button class="rate${r.count ? " has" : ""}" data-ratebtn="1" title="דירוג משותף של המורים">${rateText(r)}</button><span class="picker">${stars}</span>
      <button class="fav${FAV.has(k) ? " on" : ""}" data-fav="1" title="שמירה ברשימה האישית שלי">${FAV.has(k) ? "♥" : "♡"}</button></div>
  </div>`;
}

// a picture of the material itself: the first page of a Drive file, or the frame of a YouTube video
function thumbOf(it) {
  if (it.im) return {src: it.im, big: it.im, wide: !it.im.includes("/ach/"), u: it.files[0].u};
  for (const f of it.files) {
    if (!/^https?:/.test(f.u) && /^[\w-]{25,}$/.test(f.id))
      return {src: `https://drive.google.com/thumbnail?id=${f.id}&sz=w320`, big: `https://drive.google.com/thumbnail?id=${f.id}&sz=w640`, wide: f.f === "ppt", u: viewHref(f)};
    const y = f.u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/);
    if (y) return {src: `https://i.ytimg.com/vi/${y[1]}/mqdefault.jpg`, big: `https://i.ytimg.com/vi/${y[1]}/hqdefault.jpg`, wide: true, vid: true, u: f.u};
    const d = f.f !== "folder" && f.u.match(/(?:drive|docs)\.google\.com\/(?:file\/d\/|(?:document|presentation|spreadsheets)\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
    if (d) return {src: `https://drive.google.com/thumbnail?id=${d[1]}&sz=w320`, big: `https://drive.google.com/thumbnail?id=${d[1]}&sz=w640`, wide: f.f === "ppt", u: f.u};
  }
  return null;
}
function thumbHtml(it, icon) {
  const m = FMT[it.files[0].f.replace("achiya:", "")] || FMT.web, t = thumbOf(it);
  const fb = `<span class="fb" style="background:${m[3]}">${icon}</span>`;
  if (!t) return `<a class="th noimg" href="${esc(it.files[0].u)}" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1">${fb}</a>`;
  return `<a class="th${t.wide ? " wide" : ""}${t.vid ? " vid" : ""}" href="${esc(t.u)}" target="_blank" rel="noopener" tabindex="-1" data-big="${esc(t.big)}">` +
    `<img src="${esc(t.src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg')">${fb}</a>`;
}
function rateText(r) { return r.count ? `★ ${r.avg.toFixed(1)} (${r.count})` : "☆ דרגו"; }
// a file kept in git (this site or a <slug>-files repo on GitHub Pages): Word / PowerPoint open in the Office viewer
const inGit = u => !/^https?:/.test(u) || /^https:\/\/yudataub\.github\.io\//.test(u);
function viewHref(f) {
  if (!inGit(f.u)) return f.u;
  const abs = new URL(f.u, location.href).href, lim = f.f === "excel" ? 5e6 : 10e6;
  return ["word", "ppt", "excel"].includes(f.f) && f.b && f.b <= lim ? "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(abs) : abs;
}
function btnHtml(file) {
  const ach = file.f.startsWith("achiya:"), k = file.f.replace("achiya:", ""), m = FMT[k] || FMT.web;
  const text = ach ? (k !== "web" ? m[1] + " · באתר אחיה" : "באתר אחיה") : (VERB[k] || m[1]);
  const local = inGit(file.u), href = viewHref(file);
  return `<a class="btn" style="color:${m[2]};background:${m[3]};border-color:${m[3]}" href="${esc(href)}" target="_blank" rel="noopener">${text}${file.z ? ` <span class="sz">· ${esc(file.z)}</span>` : ""}</a>` +
    (local && href !== new URL(file.u, location.href).href ? `<a class="btn dl" href="${esc(file.u)}" download title="הורדת הקובץ">⬇️</a>` : "");
}
function sortItems(arr) {
  const abc = (a, b) => a.t.localeCompare(b.t, "he", {numeric: true});
  if (state.sort === "abc") return arr.sort(abc);
  if (state.sort === "cv")   // by chapter and verse; materials that name no chapter come after, alphabetically
    return arr.sort((a, b) => (!!b.p - !!a.p) || (a.p && b.p && (a.p[0] - b.p[0] || a.p[1] - b.p[1])) || abc(a, b));
  const score = i => { const r = rating(i); return r.avg * Math.min(r.count, 3); };
  return arr.sort((a, b) => (score(b) - score(a)) || abc(a, b));
}

function renderActive() {
  const tags = [];
  if (state.q.trim()) tags.push(["q", "חיפוש: " + state.q.trim()]);
  if (state.fmt) tags.push(["fmt", FILTERS.find(f => f[0] === state.fmt)[1]]);
  if (state.grade) tags.push(["grade", state.grade]);
  if (state.src) tags.push(["src", state.src]);
  document.getElementById("active").innerHTML = tags.length ? '<span class="lbl">מסננים פעילים:</span>' +
    tags.map(([k, l]) => `<button class="tag" data-clear="${k}">${esc(l)}<b>×</b></button>`).join("") +
    (tags.length > 1 ? '<button class="clearall" data-clear="all">ניקוי הכול</button>' : "") : "";
}
function clearFilter(k) {
  if (k === "q" || k === "all") { state.q = ""; document.getElementById("q").value = ""; }
  if (k === "fmt" || k === "all") { state.fmt = ""; renderChips(); }
  if (k === "grade" || k === "all") { state.grade = ""; document.getElementById("grade").value = ""; }
  if (k === "src" || k === "all") { state.src = ""; document.getElementById("src").value = ""; }
  render();
}
function renderCtx(n) {
  let head;
  if (state.fmt === "fav") head = "♥ השמורים שלי";
  else if (state.q.trim()) head = `חיפוש: „${state.q.trim()}”`;
  else head = tabLabel(state.tab);
  const all = state.q.trim() || state.fmt === "fav" ? n : D.items.filter(inTab).length;
  // D.pages: a page of its own for each tab of a group (e.g. "r/" -> r/<tab>.html)
  const pg = D.pages && !state.q.trim() && state.fmt !== "fav" && D.tabs.some(t => t.k === state.tab && t.g && !t.k.startsWith("gen-"))
    ? `<a class="pglink" href="${esc(D.pages + state.tab)}.html">📄 הדף של ${esc(head.split(":")[0])}</a>` : "";
  document.getElementById("ctx").innerHTML = `<span>${esc(head)}</span><span class="cn">${n === all ? `${n} חומרים` : `נמצאו ${n} מתוך ${all} חומרים`}</span>${pg}`;
}
function render() {
  renderTabs(); renderActive();
  const items = visibleItems(), main = document.getElementById("main");
  renderCtx(items.length);
  const cross = !!state.q.trim() || state.fmt === "fav" || isGroup(state.tab);
  if (!items.length) { main.innerHTML = `<div class="empty">${state.fmt === "fav" ? "עוד לא שמרתם חומרים – לוחצים על ♡ ליד חומר כדי לשמור אותו כאן" : "לא נמצאו חומרים. נסו מילה אחרת או לשונית אחרת."}</div>`; return; }
  const byCat = {}; items.forEach(i => (byCat[i.c] = byCat[i.c] || []).push(i));
  main.innerHTML = D.cats.filter(c => byCat[c.k]).map(c => {
    const list = sortItems(byCat[c.k]);
    const first = list.slice(0, PAGE).map(i => rowHtml(i, cross)).join("");
    const rest = list.length > PAGE ? `<button class="more" data-cat="${c.k}">הצגת כל ${list.length}</button>` : "";
    const cc = CATCOL[c.k] || CATCOL.more;
    return `<details class="cat" open data-cat="${c.k}" style="--cc:${cc[0]};--cs:${cc[1]}"><summary><span><span class="ce">${c.e}</span>${esc(c.l)}</span><span class="cnt">${list.length}</span></summary><div class="rows">${first}</div>${rest}</details>`;
  }).join("");
  loadRatings(items);
}

async function loadRatings(items) {
  const api = window.__ratingsApi; if (!api) return;
  const ids = items.slice(0, 400).flatMap(idsOf);
  const before = api.ratingsCache.size;
  await api.fetchRatings(ids);
  if (api.ratingsCache.size !== before) document.querySelectorAll(".row").forEach(row => {
    const it = BYKEY[row.dataset.id]; if (!it) return;
    const r = rating(it), b = row.querySelector(".rate"); b.textContent = rateText(r); b.classList.toggle("has", !!r.count);
  });
}

let BYKEY = {};
function setTab(k) { state.tab = k; state.q = ""; document.getElementById("q").value = ""; if (state.fmt === "fav") state.fmt = ""; history.replaceState(null, "", "#" + encodeURIComponent(k)); renderChips(); render(); window.scrollTo({top: 0}); }
function renderChips() {
  document.getElementById("fmt").innerHTML = FILTERS.map(([k, l]) => `<button class="chip${state.fmt === k ? " on" : ""}" data-fmt="${k}">${l}</button>`).join("");
}

document.addEventListener("click", async e => {
  const v = e.target.closest("[data-view]"); if (v) return setView(v.dataset.view);
  const t = e.target.closest("[data-k],[data-fmt],[data-cat].more,[data-rate],[data-fav],[data-ratebtn],[data-clear]");
  const mineP = t && t.closest(".side") ? t.closest(".side").querySelector(".picker") : null;
  document.querySelectorAll(".picker.open").forEach(p => { if (p !== mineP) p.classList.remove("open"); });
  if (!t) return;
  if (t.dataset.clear !== undefined) return clearFilter(t.dataset.clear);
  if (t.dataset.ratebtn) { mineP.classList.toggle("open"); return; }
  if (t.dataset.k !== undefined) return setTab(t.dataset.k);
  if (t.dataset.fmt !== undefined) { state.fmt = state.fmt === t.dataset.fmt ? "" : t.dataset.fmt; renderChips(); return render(); }
  if (t.classList.contains("more")) {
    const c = t.dataset.cat, sec = t.closest("details");
    const list = sortItems(visibleItems().filter(i => i.c === c));
    t.remove(); sec.querySelector(".rows").insertAdjacentHTML("beforeend", list.slice(PAGE).map(i => rowHtml(i, !!state.q.trim() || state.fmt === "fav" || isGroup(state.tab))).join(""));
    return loadRatings(list);
  }
  const row = t.closest(".row"); if (!row) return; const k = row.dataset.id;
  if (t.dataset.fav) { FAV.has(k) ? FAV.delete(k) : FAV.add(k); save("fav", [...FAV]); t.classList.toggle("on"); t.textContent = FAV.has(k) ? "♥" : "♡"; return; }
  if (t.dataset.rate) {
    const v = +t.dataset.rate, old = MINE[k] || 0; if (v === old) return;
    MINE[k] = v; save("mine", MINE);
    row.querySelectorAll(".picker button").forEach(b => b.classList.toggle("on", +b.dataset.rate <= v));
    row.querySelector(".picker").classList.remove("open");
    try { await window.__ratingsApi.submitRating(k, v, old); window.__ratingsApi.ratingsCache.delete(k); loadRatings([BYKEY[k]]); } catch (err) { console.error(err); }
  }
});
let qTimer; document.getElementById("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 200); });
document.getElementById("src").addEventListener("change", e => { state.src = e.target.value; render(); });
document.getElementById("grade").addEventListener("change", e => { state.grade = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
window.addEventListener("ratings-ready", () => D && render());
function setView(v) {
  document.getElementById("main").classList.toggle("grid", v === "grid");
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  try { localStorage.setItem("cat2_view", v); } catch (e) {}
}
// hovering a thumbnail (mouse only) shows a larger picture of the page
const peek = document.body.appendChild(Object.assign(document.createElement("div"), {id: "peek"}));
document.addEventListener("mouseover", e => {
  const th = e.target.closest(".th[data-big]");
  if (!th || th.classList.contains("noimg") || document.getElementById("main").classList.contains("grid") || !matchMedia("(hover:hover)").matches) { peek.style.display = "none"; return; }
  const r = th.getBoundingClientRect();
  peek.innerHTML = `<img src="${th.dataset.big}" alt="" referrerpolicy="no-referrer">`;
  peek.style.display = "block";
  peek.style.top = Math.max(8, Math.min(r.top - 40, innerHeight - 460)) + "px";
  peek.style.right = (innerWidth - r.left + 12) + "px";
});
const toolsEl = document.querySelector(".tools");
const totop = document.body.appendChild(Object.assign(document.createElement("button"), {id: "totop", textContent: "🔍 חיפוש וסינון"}));
totop.addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
addEventListener("scroll", () => totop.classList.toggle("show", toolsEl.getBoundingClientRect().bottom < 0), {passive: true});
let savedView = "grid"; try { savedView = localStorage.getItem("cat2_view") || "grid"; } catch (e) {}
setView(savedView);

fetch("data.json").then(r => r.json()).then(data => {
  D = data; FAV = new Set(load("fav", [])); MINE = load("mine", {});
  D.items.forEach(i => BYKEY[keyOf(i)] = i);
  D.tabs.forEach(t => { if (t.g) TG[t.k] = t.g; });
  const T = D.title || "חומש " + D.book, unit = D.unit || "פרשות", one = D.one || (unit === "פרקים" ? "פרק" : "פרשה");
  if (D.cvLabel) document.querySelector('#sort option[value="cv"]').textContent = D.cvLabel;
  document.title = "קטלוג חומרים – " + T;
  if (D.hero && D.heroStyle === "side") {   // a picture from the materials, shown whole in a frame beside the title
    const hd = document.querySelector("header"), wrap = hd.querySelector(".wrap"), txt = document.createElement("div");
    txt.className = "htext"; while (wrap.firstChild) txt.appendChild(wrap.firstChild);
    wrap.appendChild(txt);
    wrap.insertAdjacentHTML("beforeend", `<img class="heroimg" src="${D.hero}" alt="" style="object-position:${D.heroPos || "center"}">`);
    hd.classList.add("hero-side");
  } else if (D.hero) {   // a picture of the book behind the title; the dark side keeps the text readable
    const hd = document.querySelector("header");
    hd.classList.add("hero");
    hd.style.backgroundImage = `linear-gradient(to left, rgba(30,27,75,.92) 0%, rgba(30,27,75,.72) 38%, rgba(30,27,75,.15) 75%, rgba(30,27,75,0)), url("${D.hero}")`;
  }
  document.getElementById("title").textContent = "קטלוג חומרים – " + T;
  if (D.q) document.getElementById("q").placeholder = D.q;
  const files = D.items.reduce((n, i) => n + i.files.length, 0);
  document.getElementById("sub").textContent = `${D.items.length.toLocaleString("he")} חומרים לפי ${unit} • בוחרים ${one}, ואז מה צריך לשיעור`;
  const srcs = [...new Set(D.items.map(i => i.s).filter(Boolean))].sort((a, b) => a.localeCompare(b, "he"));
  document.getElementById("src").insertAdjacentHTML("beforeend", srcs.map(s => `<option>${esc(s)}</option>`).join(""));
  const grades = ["הגיל הרך", "כיתות א, ב", "כיתות ג, ד, ה", "כיתות ו, ז, ח", "מורים", "הורים"].filter(g => D.items.some(i => i.gr === g));
  document.getElementById("grade").insertAdjacentHTML("beforeend", grades.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join(""));
  if (!grades.length) document.getElementById("grade").style.display = "none";
  const h = decodeURIComponent(location.hash.slice(1));
  state.tab = D.tabs.some(t => t.k === h) || isGroup(h) ? h : D.start || (D.tabs[1] || D.tabs[0]).k;
  renderChips(); render();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDocs, collection, query, where, documentId, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig = {"apiKey": ["AIza", "SyBgjtJk9Wrw-lPpFlPBaQ6RHfqQ58R58LA"].join(""), "authDomain": "gamma-catalog.firebaseapp.com", "projectId": "gamma-catalog", "storageBucket": "gamma-catalog.firebasestorage.app", "messagingSenderId": "184606827021", "appId": "1:184606827021:web:e39a832b5bc12fe87aeb44"};
const db = getFirestore(initializeApp(firebaseConfig));
const ratingsCache = new Map();
async function fetchRatings(ids) {
  const need = [...new Set(ids)].filter(id => !ratingsCache.has(id));
  for (let i = 0; i < need.length; i += 10) {
    const b = need.slice(i, i + 10); b.forEach(id => ratingsCache.set(id, {sum: 0, count: 0}));
    try { (await getDocs(query(collection(db, "ratings"), where(documentId(), "in", b)))).forEach(d => ratingsCache.set(d.id, d.data())); }
    catch (e) { console.error("fetchRatings failed", e); }
  }
}
async function submitRating(id, newValue, oldValue) {
  const ref = doc(db, "ratings", id);
  await runTransaction(db, async tx => {
    const snap = await tx.get(ref); let sum = 0, count = 0;
    if (snap.exists()) { sum = snap.data().sum || 0; count = snap.data().count || 0; }
    if (oldValue) sum += newValue - oldValue; else { sum += newValue; count += 1; }
    tx.set(ref, {sum, count});
  });
}
window.__ratingsApi = {fetchRatings, submitRating, ratingsCache};
window.dispatchEvent(new Event("ratings-ready"));
</script>
